name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build static site configuration
        env:
          GAON_API_BASE: ${{ vars.GAON_API_BASE }}
        run: |
          mkdir _site
          cp index.html styles.css game.js .nojekyll _site/
          node -e "const fs=require('fs');const base=(process.env.GAON_API_BASE||'').replace(/\/$/,'');fs.writeFileSync('_site/config.js','window.GAON_API_BASE = '+JSON.stringify(base)+';\nwindow.GAON_DEMO_MODE = '+JSON.stringify(!base)+';\n')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
